name: Daily crypto report

# Runs the agent's daily report without depending on any local machine being
# on. Uses a local Ollama model (free) instead of the Claude API.
#
# This is the ONLY scheduled daily report. There used to be a launchd job
# on the Mac (com.cryptoagent.dailyreport) firing at the same wall-clock
# time, which is why two reports arrived every day until 2026-07-31; that
# job is now disabled. launchd still owns bullet-check (every 15 min),
# which has no equivalent here.
#
# State (DCA purchases, bullets) lives in Supabase, shared with the local
# launchd-driven bullet-check on your Mac -- both see the same real data.

on:
  schedule:
    # Scheduled for 09:00 UTC to LAND near 08:00 Argentina (UTC-3), not to
    # start then. GitHub queues scheduled workflows when the platform is
    # busy and they routinely run late: measured starts over five days
    # against an 11:00 UTC cron were 12:25, 12:50, 12:51, 12:56 and 13:34
    # UTC -- between 1h25m and 2h34m late, median ~1h50m. Adding the job's
    # own ~10 min runtime, 09:00 UTC typically delivers around 07:45-08:45
    # Argentina. Do not "fix" this to 11:00 expecting an 08:00 delivery.
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # CPU-only inference can be slow; fail fast instead of hanging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-${{ vars.OLLAMA_MODEL || 'llama3.1' }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/ && break
            sleep 1
          done

      - name: Pull the model (no-op if already cached)
        run: ollama pull "${{ vars.OLLAMA_MODEL || 'llama3.1' }}"

      - name: Run the daily report
        env:
          LLM_BACKEND: ollama
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.1' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || 'en' }}
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'console' }}
          SYMBOL: ${{ vars.SYMBOL || 'BTC/USDT' }}
          # YouTube creator digest (off unless the repo variable says so).
          # NOTE: transcript fetching from a datacenter IP may be blocked
          # by YouTube -- see README's "YouTube creator digest".
          YOUTUBE_DIGEST_ENABLED: ${{ vars.YOUTUBE_DIGEST_ENABLED || 'false' }}
          YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py report
