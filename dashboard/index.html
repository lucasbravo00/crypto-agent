<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07090D" />
  <title>Crypto Agent · Dashboard</title>

  <!-- Supabase JS SDK and Chart.js, both from public CDNs (no build step). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <!-- Space Grotesk for UI (technical, distinctive) + JetBrains Mono for
       every number: tabular figures keep columns of money aligned, which
       is the single biggest readability win in a financial table. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #07090D;
      --surface:   #11151C;
      --surface-2: #161B23;
      --surface-3: #1C222C;
      --line:      rgba(255,255,255,.07);
      --line-2:    rgba(255,255,255,.14);
      --tx:        #E8ECF2;
      --tx-2:      #97A1B0;
      --tx-3:      #5C6673;
      --or:        #F7931A;   /* bitcoin orange */
      --or-dim:    rgba(247,147,26,.13);
      --gr:        #2EBD85;
      --gr-dim:    rgba(46,189,133,.13);
      --rd:        #F6465D;
      --rd-dim:    rgba(246,70,93,.13);
      --bl:        #4C8DFF;
      --pu:        #A78BFA;
      --yl:        #E3B341;
      --r:   12px;
      --r-lg:16px;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
      --ui: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --prose: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--ui);
      background: var(--bg);
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }
    /* Single soft glow behind the top of the page — gives the flat dark
       background some depth without any per-card gradients. */
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 420px at 50% -140px, rgba(247,147,26,.10), transparent 70%),
        radial-gradient(700px 380px at 88% -60px,  rgba(76,141,255,.07), transparent 70%);
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .pos { color: var(--gr); }
    .neg { color: var(--rd); }
    .dim { color: var(--tx-2); }

    /* ============ LOGIN ============ */
    #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1; }
    .login-card {
      background: var(--surface); border:1px solid var(--line);
      border-radius: var(--r-lg); padding:32px; width:100%; max-width:380px;
      box-shadow: var(--shadow);
    }
    .login-card h1 { margin:18px 0 6px; font-size:21px; font-weight:700; letter-spacing:-.02em; }
    .login-card > p { margin:0 0 26px; color:var(--tx-2); font-size:13.5px; line-height:1.5; }
    .field { position:relative; margin-bottom:11px; }
    .field input {
      width:100%; padding:13px 14px; background:var(--bg); border:1px solid var(--line);
      border-radius:10px; color:var(--tx); font-size:14.5px; font-family:var(--ui);
      transition: border-color .15s, background .15s;
    }
    .field input:focus { outline:none; border-color:var(--or); background:var(--surface-2); }
    .field input::placeholder { color:var(--tx-3); }
    .btn-primary {
      width:100%; padding:13px; background:var(--or); color:#0B0B0B; border:none;
      border-radius:10px; font-size:14.5px; font-weight:700; cursor:pointer;
      font-family:var(--ui); transition: filter .15s, transform .05s;
    }
    .btn-primary:hover { filter:brightness(1.08); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity:.55; cursor:default; }
    .error { color:var(--rd); font-size:12.5px; margin-top:12px; min-height:18px; line-height:1.4; }

    /* Brand mark: rounded orange tile with the ₿ glyph. */
    .mark {
      width:38px; height:38px; border-radius:11px; flex:none;
      background: linear-gradient(150deg, #FFB350, var(--or) 55%, #D97706);
      color:#120C02; display:grid; place-items:center;
      font-size:20px; font-weight:700; line-height:1;
      box-shadow: 0 4px 14px -4px rgba(247,147,26,.6);
    }
    .mark.sm { width:30px; height:30px; border-radius:9px; font-size:16px; }

    /* ============ SHELL ============ */
    #app { display:none; position:relative; z-index:1; }
    .wrap { max-width:1240px; margin:0 auto; padding:0 22px; }

    .topbar {
      position:sticky; top:0; z-index:40;
      background: rgba(7,9,13,.82);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom:1px solid var(--line);
    }
    .topbar-in { display:flex; align-items:center; gap:14px; height:62px; }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand b { font-size:15px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
    .brand span { font-size:11px; color:var(--tx-3); display:block; margin-top:1px; letter-spacing:.02em; }
    .spacer { flex:1; }

    /* Live price pill — always visible, the one number worth pinning. */
    .price-pill {
      display:flex; align-items:center; gap:10px; padding:7px 13px;
      background:var(--surface); border:1px solid var(--line); border-radius:999px;
    }
    .price-pill .p { font-family:var(--mono); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
    .price-pill .c { font-family:var(--mono); font-size:12px; font-weight:500; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--gr); flex:none; }
    .dot.live { animation: pulse 2.2s ease-in-out infinite; }
    .dot.stale { background:var(--tx-3); animation:none; }
    @keyframes pulse {
      0%,100% { box-shadow:0 0 0 0 rgba(46,189,133,.55); opacity:1; }
      50%     { box-shadow:0 0 0 5px rgba(46,189,133,0); opacity:.75; }
    }

    .icon-btn {
      width:34px; height:34px; display:grid; place-items:center; flex:none;
      background:var(--surface); border:1px solid var(--line); border-radius:9px;
      color:var(--tx-2); cursor:pointer; font-size:14px; transition:.15s;
    }
    .icon-btn:hover { color:var(--tx); border-color:var(--line-2); background:var(--surface-2); }
    .icon-btn.spin svg { animation: rot .8s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ============ HERO ============ */
    .hero { display:grid; grid-template-columns: 1.15fr 1fr; gap:16px; margin:26px 0 22px; }
    .hero-main {
      background: var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
      padding:22px 24px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    }
    .hero-main::after {
      content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px;
      background: radial-gradient(circle, rgba(247,147,26,.10), transparent 70%); pointer-events:none;
    }
    .eyebrow {
      font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
      color:var(--tx-3); display:flex; align-items:center; gap:7px;
    }
    .hero-value {
      font-family:var(--mono); font-size:42px; font-weight:700; letter-spacing:-.035em;
      margin:10px 0 6px; line-height:1; font-variant-numeric:tabular-nums;
    }
    .hero-delta { font-family:var(--mono); font-size:13.5px; font-weight:500; }

    /* Stacked bar splitting real DCA money from virtual demo VST money. */
    .split { margin-top:20px; }
    .split-bar { display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--surface-3); gap:2px; }
    .split-bar i { display:block; height:100%; border-radius:999px; }
    .split-legend { display:flex; gap:18px; margin-top:11px; flex-wrap:wrap; }
    .split-legend div { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--tx-2); }
    .swatch { width:8px; height:8px; border-radius:3px; flex:none; }

    .hero-side { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .gauge-card {
      background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
      padding:18px; display:flex; flex-direction:column; align-items:center; box-shadow:var(--shadow);
    }
    .gauge-card .eyebrow { align-self:flex-start; }
    .gauge-val { font-family:var(--mono); font-size:26px; font-weight:700; line-height:1; margin-top:-14px; }
    .gauge-sub { font-size:11.5px; color:var(--tx-2); margin-top:6px; text-align:center; line-height:1.4; }

    /* ============ TABS ============ */
    .tabs {
      display:flex; gap:4px; border-bottom:1px solid var(--line);
      position:sticky; top:62px; z-index:30; background:rgba(7,9,13,.9);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      overflow-x:auto; scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      appearance:none; background:none; border:none; cursor:pointer;
      font-family:var(--ui); font-size:13.5px; font-weight:500; color:var(--tx-2);
      padding:13px 15px; white-space:nowrap; position:relative; transition:color .15s;
      display:flex; align-items:center; gap:7px;
    }
    .tab:hover { color:var(--tx); }
    .tab.active { color:var(--tx); font-weight:600; }
    .tab.active::after {
      content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px;
      background:var(--or); border-radius:2px 2px 0 0;
    }
    .tab .count {
      font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:5px;
      background:var(--surface-3); color:var(--tx-2); font-weight:500;
    }
    .panel { display:none; padding:24px 0 40px; }
    .panel.active { display:block; animation: fade .22s ease; }
    @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    /* ============ BLOCKS ============ */
    .block {
      background:var(--surface); border:1px solid var(--line);
      border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden;
    }
    .block-head {
      display:flex; align-items:center; gap:10px; padding:15px 18px;
      border-bottom:1px solid var(--line);
    }
    .block-head h3 { margin:0; font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
    .block-head .tag {
      font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
      padding:3px 7px; border-radius:5px; background:var(--surface-3); color:var(--tx-2);
    }
    .block-head .tag.real  { background:var(--or-dim); color:var(--or); }
    .block-head .tag.demo  { background:rgba(76,141,255,.13); color:var(--bl); }
    .block-body { padding:18px; }
    .note { color:var(--tx-2); font-size:12.5px; line-height:1.6; margin:0 0 16px; font-family:var(--prose); }
    .note:last-child { margin-bottom:0; }
    .note code { font-family:var(--mono); font-size:11.5px; background:var(--surface-3); padding:1px 5px; border-radius:4px; color:var(--tx); }

    .grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
    /* The cycle panel always has 4 charts: a hard 2x2 beats auto-fit's
       ragged 3+1 at wide viewports. */
    .grid-2x2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    @media (max-width: 860px) { .grid-2x2 { grid-template-columns:1fr; } }
    .grid-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }

    /* Stat: label / value / sub. Used inside blocks, in a tight grid. */
    /* Fixed 2 columns: these blocks always show 4 stats, and auto-fit left
       ragged empty cells that read as broken layout. */
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px;
             background:var(--line); border-radius:10px; overflow:hidden; }
    .stats.wide { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
    .stat { background:var(--surface); padding:14px 15px; }
    .stat .l { font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--tx-3); }
    .stat .v { font-family:var(--mono); font-size:19px; font-weight:700; margin-top:7px; letter-spacing:-.02em; }
    .stat .s { font-family:var(--mono); font-size:11.5px; margin-top:4px; color:var(--tx-2); }

    /* 30-segment round budget indicator. */
    .segs { display:flex; gap:3px; margin:12px 0 8px; }
    .segs i { flex:1; height:22px; border-radius:3px; background:var(--surface-3); transition:.2s; }
    .segs i.on { background:var(--or); box-shadow:0 0 10px -2px rgba(247,147,26,.7); }

    /* Progress toward the round's combined +15% target. */
    /* Side padding keeps the two end flags from clipping at the edges. */
    .track { position:relative; height:30px; margin:16px 40px 8px; }
    .track-bg { position:absolute; inset:11px 0 auto; height:8px; border-radius:999px; background:var(--surface-3); }
    .track-fill { position:absolute; top:11px; height:8px; border-radius:999px; transition:.3s; }
    .track-zero { position:absolute; top:5px; width:1px; height:20px; background:var(--line-2); }
    .track-goal, .track-end { position:absolute; top:2px; transform:translateX(-50%);
                              font-size:10px; color:var(--tx-3); font-family:var(--mono);
                              white-space:nowrap; }
    .track-goal::after, .track-end::after { content:""; position:absolute; left:50%; top:13px;
                              width:2px; height:14px; border-radius:2px; }
    .track-goal::after { background:var(--gr); }
    .track-end::after  { background:var(--rd); }
    .track-mark { position:absolute; top:8px; width:3px; height:14px; border-radius:2px; background:var(--tx); transform:translateX(-50%); }

    /* ============ CHARTS ============ */
    .chart-box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow); }
    .chart-box h4 { margin:0 0 3px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .chart-box .sub { color:var(--tx-3); font-size:11.5px; margin:0 0 14px; line-height:1.5; font-family:var(--prose); }
    .chart-box canvas { width:100%; }
    .chip { font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; background:var(--surface-3); color:var(--tx-2); }
    .chip.up { background:var(--gr-dim); color:var(--gr); }
    .chip.down { background:var(--rd-dim); color:var(--rd); }
    .chip.hot { background:var(--rd-dim); color:var(--rd); }
    .chip.cold { background:var(--gr-dim); color:var(--gr); }

    /* ============ TABLES ============ */
    .table-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
    thead th {
      font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
      color:var(--tx-3); background:var(--surface-2); position:sticky; top:0;
    }
    tbody tr { transition:background .12s; }
    tbody tr:hover { background:var(--surface-2); }
    tbody tr:last-child td { border-bottom:none; }
    td.num, th.num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
    tr.group td {
      background:var(--surface-2); font-size:11.5px; font-weight:600;
      letter-spacing:.03em; color:var(--tx-2); padding:9px 14px;
    }
    tr.group .rn { color:var(--tx); font-weight:700; }
    .badge { padding:3px 8px; border-radius:6px; font-size:10.5px; font-weight:600; letter-spacing:.02em; }
    .badge.open, .badge.tracking { background:var(--or-dim); color:var(--or); }
    .badge.closed_tp { background:var(--gr-dim); color:var(--gr); }
    .badge.closed_manual, .badge.closed_liquidated { background:rgba(151,161,176,.13); color:var(--tx-2); }
    .src { font-size:11px; color:var(--tx-3); }

    /* ============ REPORT ============ */
    .report {
      display:flex; gap:14px; padding:20px; background:var(--surface);
      border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);
    }
    .report-body { min-width:0; flex:1; }
    .report-meta { display:flex; align-items:center; gap:9px; margin-bottom:10px; flex-wrap:wrap; }
    .report-meta b { font-size:13px; font-weight:600; }
    .report-meta time { font-size:11.5px; color:var(--tx-3); font-family:var(--mono); }
    .report-text { white-space:pre-wrap; line-height:1.72; font-size:14.5px; font-family:var(--prose); color:#DFE4EC; max-width:70ch; }
    .archive-item {
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      background:none; border:none; border-bottom:1px solid var(--line);
      padding:13px 18px; cursor:pointer; color:var(--tx-2); font-family:var(--ui); font-size:13px;
      transition:background .12s;
    }
    .archive-item:hover { background:var(--surface-2); color:var(--tx); }
    .archive-item time { font-family:var(--mono); font-size:12px; color:var(--tx-3); flex:none; width:88px; }
    .archive-item .snippet { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

    /* ============ MISC ============ */
    .empty { color:var(--tx-3); font-size:13.5px; padding:34px 18px; text-align:center; line-height:1.6; }
    .empty .big { font-size:26px; display:block; margin-bottom:10px; opacity:.5; }
    .skel { background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
            background-size:200% 100%; animation:sh 1.3s infinite; border-radius:8px; }
    @keyframes sh { to { background-position:-200% 0; } }
    .disclaimer {
      border-top:1px solid var(--line); margin-top:8px; padding:26px 0 44px;
      color:var(--tx-3); font-size:11.5px; text-align:center; line-height:1.65; font-family:var(--prose);
    }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .mt { margin-top:16px; }

    @media (max-width: 900px) {
      .hero { grid-template-columns:1fr; }
      .hero-value { font-size:34px; }
      .wrap { padding:0 14px; }
      .brand span { display:none; }
      .price-pill .c { display:none; }
    }
    @media (max-width: 560px) {
      /* Keep both gauges side by side (they scale down fine) instead of
         costing two full screens of vertical scroll. */
      .gauge-card { padding:14px 8px; }
      .gauge-card svg { width:100%; height:auto; max-width:148px; }
      .report { flex-direction:column; gap:10px; }
      /* The brand wordmark is the first thing to go: at 375px it collided
         with the price pill. The mark alone still identifies the app. */
      .brand b { display:none; }
      .topbar-in { gap:9px; height:56px; }
      .price-pill { padding:6px 11px; }
      .hero-value { font-size:30px; }
      th, td { padding:10px 11px; }
    }
  </style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" id="login-form">
    <div class="mark">₿</div>
    <h1>Crypto Agent</h1>
    <p data-i18n="loginTagline"></p>
    <div class="field"><input type="email" id="email" placeholder="Email" autocomplete="username" required /></div>
    <div class="field"><input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" autocomplete="current-password" required /></div>
    <button type="submit" class="btn-primary" id="login-btn" data-i18n="loginButton"></button>
    <div class="error" id="login-error"></div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="wrap topbar-in">
      <div class="brand">
        <div class="mark sm">₿</div>
        <div>
          <b>Crypto Agent</b>
          <span id="last-updated">—</span>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="price-pill" id="price-pill">
        <span class="dot stale" id="live-dot"></span>
        <span class="p mono" id="live-price">—</span>
        <span class="c mono" id="live-change"></span>
      </div>
      <button class="icon-btn" id="refresh-btn" data-i18n-title="refreshTitle">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="logout-btn" data-i18n-title="logoutTitle">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>

  <div class="wrap">
    <!-- ---- HERO ---- -->
    <div class="hero">
      <div class="hero-main">
        <div class="eyebrow" data-i18n="heroEyebrow"></div>
        <div class="hero-value" id="hero-total">—</div>
        <div class="hero-delta" id="hero-delta"></div>
        <div class="split">
          <div class="split-bar" id="split-bar"></div>
          <div class="split-legend" id="split-legend"></div>
        </div>

const LANG = I18N[DASHBOARD_LANGUAGE] ? DASHBOARD_LANGUAGE : "en";
const LOCALE = LOCALE_BY_LANG[LANG] || "en-US";
document.documentElement.lang = LANG;

// t("key", {var: value}) looks up the current language, falls back to
// English, and finally to the raw key -- so a missing translation shows
// up as a visible mistake instead of a silent blank.
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? (I18N.en && I18N.en[key]) ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

// Static markup (login screen, panel headers/notes/table headers that
// never change at runtime) is translated once via data-i18n* attributes,
// rather than duplicating three copies of the HTML.
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    const label = t(el.dataset.i18nTitle);
    el.title = label;
    el.setAttribute("aria-label", label);
  });
}
applyStaticI18n();


// Cross-cutting data kept in memory so the live-price refresh (every 30s)
// can recompute price-dependent views without re-querying Supabase each
// time. Populated once per full loadData() call.

let livePrice = null;
let liveChange24h = null;
let cycleChartsBuilt = false;

// ---- number/format helpers ----
// Sign goes BEFORE the currency symbol ("-$1,51", not "$-1,51") -- the
// default toLocaleString placement reads as a typo in a P&L column.
const money = (n, d) => {
  if (n == null || isNaN(n)) return "—";
  const s = Number(n) < 0 ? "-" : "";
  return s + "$" + Math.abs(Number(n)).toLocaleString(LOCALE,
    { minimumFractionDigits: d, maximumFractionDigits: d });
};
const fmtUsd  = (n) => money(n, 2);
const fmtUsd0 = (n) => money(n, 0);
const fmtPct = (n) => n == null || isNaN(n) ? "—" : (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%";
const fmtNum = (n, d = 2) => n == null || isNaN(n) ? "—" : Number(n).toFixed(d);
const clsSign = (n) => n == null || isNaN(n) ? "" : (n >= 0 ? "pos" : "neg");
const fmtDate = (s) => s ? new Date(s).toLocaleDateString(LOCALE,
  { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fmtDateShort = (s) => s ? new Date(s).toLocaleDateString(LOCALE,
  { day: "2-digit", month: "short" }) : "—";
const fmtDateTime = (s) => s ? new Date(s).toLocaleString(LOCALE,
  { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";

async function showDashboard() {

  $("app").style.display = "block";

  // every 30s live-price tick. The *charts* are only built when its tab
  // is first opened, but the *data* is needed right away for the hero
  // gauges (a Mayer computed from today's Binance close is fresher than
  // the one stored in the last daily snapshot).

// ============ TABS ============
// Chart.js sizes a canvas to its parent at construction time, so a canvas
// inside a display:none panel would render 1px wide. Every activation
// resizes whatever just became visible, and the cycle charts are built
// lazily the first time their tab is opened.
function showTab(name) {
  // Named `tabEl`, not `t` -- this file also has a global t() for i18n
  // strings, and a same-named forEach parameter here would shadow it.
  document.querySelectorAll(".tab").forEach(tabEl => tabEl.classList.toggle("active", tabEl.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  if (name === "ciclo" && !cycleChartsBuilt) buildCycleCharts();
  requestAnimationFrame(() => Object.values(charts).forEach(c => { try { c.resize(); } catch (e) {} }));
  try { localStorage.setItem("ca_tab", name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(tabEl =>
  tabEl.addEventListener("click", () => showTab(tabEl.dataset.tab)));

function restoreTab() {
  let saved = null;
  try { saved = localStorage.getItem("ca_tab"); } catch (e) {}
  if (saved && $("panel-" + saved)) showTab(saved);
}

// ---- Live price: fetched directly from the browser, bypassing Supabase
// and the backend entirely. This is what makes the price pill and the
// portfolio valuation genuinely real-time instead of only as fresh as the
// last daily report. CoinGecko's public endpoint needs no API key and
// allows browser CORS requests.
async function refreshLivePrice() {
  try {
    const res = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"
    );
    const data = await res.json();
    livePrice = data.bitcoin.usd;
    liveChange24h = data.bitcoin.usd_24h_change;
  } catch (e) {
    // Best-effort: if CoinGecko is unreachable, keep showing the last
    // known live price (or fall back to the snapshot price in render).
    console.warn("Live price fetch failed:", e);
  }
  renderAll();
}

// ============ DATA ============
async function loadData() {
  const [snapsRes, dcaRes, bulletsRes, ticksRes, accountRes] = await Promise.all([
    db.from("daily_snapshots").select("*").order("created_at", { ascending: true }),
    db.from("dca_purchases").select("*").order("purchased_at", { ascending: true }),
    db.from("bullets").select("*")
      .order("round_number", { ascending: true })
      .order("bullet_number", { ascending: true }),
    db.from("price_ticks").select("*").order("created_at", { ascending: true }).limit(1000),
    db.from("account_ticks").select("*").order("created_at", { ascending: false }).limit(1),
    refreshLivePrice(),
  ]);

  cache.snaps   = snapsRes.data   || [];
  cache.dca     = dcaRes.data     || [];
  cache.bullets = bulletsRes.data || [];
  cache.ticks   = ticksRes.data   || [];
  cache.account = (accountRes.data && accountRes.data[0]) || null;

  $("cnt-dca").textContent = cache.dca.length;
  $("cnt-bullets").textContent = cache.bullets.length;

  renderAll();
  renderRecentCharts();
}

// Every price-dependent view, recomputed together. Called on full loads
// and on each 30s live-price tick.
function renderAll() {
  const m = deriveMetrics();
  renderHero(m);
  renderDcaStats(m);
  renderBulletsStats(m);
  renderCompare(cache.snaps);
  renderDcaTable(m);
  renderBulletsTable(m);
  renderReports(cache.snaps);
  renderStatusLine(m);
}

// One place that turns raw rows into every number the UI shows, so the
// cards, the tables and the hero can never disagree with each other.
function deriveMetrics() {
  const snaps = cache.snaps, dca = cache.dca, bullets = cache.bullets;
  const last = snaps[snaps.length - 1] || {};

  // Live price (from the browser) wins over the last daily snapshot
  // whenever it's available -- that's the whole point of fetching it.
  const price = livePrice ?? last.price ?? null;
  const change24h = livePrice != null ? liveChange24h : last.change_24h_pct;
  const isLive = livePrice != null;

  // Computed live from dca_purchases itself (auto-synced from your REAL
  // BingX spot trades every 15 min -- see src/dca.py), not from
  // daily_snapshots, for freshness. Value is computed from the BTC you've
  // bought regardless of where it physically sits: you rotate it to Nexo
  // for yield between weekly DCA buys, so the BingX spot wallet itself is
  // NOT a meaningful "money in account" figure here.
  const totalQtyBtc  = dca.reduce((s, p) => s + (p.amount_usd / p.price), 0);
  const totalInvested = dca.reduce((s, p) => s + Number(p.amount_usd), 0);
  const dcaValue = price != null ? price * totalQtyBtc : null;
  const dcaPnl   = dcaValue != null ? dcaValue - totalInvested : null;
  const dcaPnlPct = totalInvested ? (dcaPnl / totalInvested * 100) : null;
  const avgEntry = totalQtyBtc ? totalInvested / totalQtyBtc : null;

  // "Balance cuenta demo (VST)": the BingX Demo Trading account's own
  // reported total balance -- straight from the exchange, via
  // account_ticks (written every 15 min by bullet-check). This is the
  // capital testing the bullets strategy right now, NOT real money.
  const vstTotal = cache.account ? Number(cache.account.vst_total) : null;

  // Everything below is computed live from the "bullets" table itself
  // (synced every 15 min by bullet-check), NOT from daily_snapshots --
  // daily_snapshots only gets one row/day from the full report, so relying
  // on it here made these numbers look stale for hours.
  const active = bullets.filter(b => b.status === "open" || b.status === "tracking");
  const closed = bullets.filter(b => (b.status || "").startsWith("closed"));
  const roundOutcomes = {};
  for (const b of closed) roundOutcomes[b.round_number] = b.status;
  const roundsCompleted = Object.keys(roundOutcomes).length;
  const tpRounds = Object.values(roundOutcomes).filter(s => s === "closed_tp").length;
  const realizedPnl = closed.reduce((s, b) => s + (Number(b.realized_pnl_usd) || 0), 0);
  const currentRound = active.length
    ? active[0].round_number
    : bullets.reduce((max, b) => Math.max(max, b.round_number || 0), 0);

  // Bullets accumulate: the +15% target is evaluated on the COMBINED
  // position across every active bullet, not per bullet. Sum unrealized
  // P&L and collateral across all of them for the combined gain %.
  let combinedPnl = 0, combinedGainPct = 0, combinedCollateral = 0,
      targetPrice = null, breakEvenPrice = null;
  if (active.length && price != null) {
    let sumCoverEntry = 0, leverage = active[0].leverage || 1;
    for (const b of active) {
      const positionGainPct = (price - b.entry_price) / b.entry_price * 100 * b.leverage;
      combinedCollateral += b.collateral_usd;
      combinedPnl += b.collateral_usd * positionGainPct / 100;
      sumCoverEntry += b.collateral_usd / b.entry_price;
    }
    combinedGainPct = combinedCollateral ? (combinedPnl / combinedCollateral * 100) : 0;
    // Price at which the combined gain hits the target, solving the same
    // formula used just above for combinedGainPct (so the bar and the
    // number can't drift apart).
    if (sumCoverEntry > 0) {
      targetPrice = (combinedCollateral * (TARGET_GAIN_PCT / 100) / leverage + combinedCollateral) / sumCoverEntry;
      // Price at which the combined gain is exactly 0 -- the collateral-
      // weighted entry. Same formula with the target set to 0, so the
      // three anchors of the progress bar all come from one place.
      breakEvenPrice = combinedCollateral / sumCoverEntry;
    }
  }

  // BingX's OWN cross-margin liquidation price, recorded every 15 min by
  // bullet-check (see bingx_client.get_liquidation_price for why it can't
  // be derived here). Null when flat, or when the account_ticks migration
  // hasn't been applied yet -- the bar falls back gracefully.
  const liqPrice = cache.account && cache.account.liquidation_price != null
    ? Number(cache.account.liquidation_price) : null;

  // "Patrimonio total": real DCA value plus the demo VST balance -- one
  // number to eyeball where things stand, but the split bar underneath
  // keeps them distinguishable, since the VST leg is virtual testing
  // money, not real.
  const totalPortfolio = (dcaValue ?? 0) + (vstTotal ?? 0);

  return {
    last, price, change24h, isLive,
    totalQtyBtc, totalInvested, dcaValue, dcaPnl, dcaPnlPct, avgEntry,
    vstTotal, totalPortfolio,
    active, closed, roundsCompleted, tpRounds, realizedPnl, currentRound,
    combinedPnl, combinedGainPct, combinedCollateral, targetPrice,
    breakEvenPrice, liqPrice,
  };
}

// ---- SVG gauges. Hand-drawn arcs: no extra chart library, and they read
// far better than a bare number for "where in the range are we".
function arcPath(cx, cy, r, a0, a1) {
  const pt = (deg) => {
    const rad = (deg - 180) * Math.PI / 180;   // 0deg = left, 180deg = right
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

function renderFgGauge(value, classification) {
  const v = value == null ? null : Math.max(0, Math.min(100, Number(value)));
  const zones = [
    [0, 25, "#F6465D"], [25, 45, "#F7931A"], [45, 55, "#E3B341"],
    [55, 75, "#7FD1A0"], [75, 100, "#2EBD85"],
  ];
  const cx = 74, cy = 62, r = 52;
  const arcs = zones.map(([a, b, c]) =>
    `<path d="${arcPath(cx, cy, r, a * 1.8, b * 1.8)}" stroke="${c}" stroke-width="9"
       fill="none" stroke-linecap="round" opacity="${v == null ? .18 : (v >= a && v <= b ? 1 : .22)}"/>`).join("");
  let needle = "";
  if (v != null) {
    const rad = (v * 1.8 - 180) * Math.PI / 180;
    const x = cx + (r - 15) * Math.cos(rad), y = cy + (r - 15) * Math.sin(rad);
    needle = `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}"
                stroke="#E8ECF2" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="${cx}" cy="${cy}" r="4" fill="#E8ECF2"/>`;
  }
  $("gauge-fg").innerHTML = `<svg width="148" height="76" viewBox="0 0 148 76">${arcs}${needle}</svg>`;
  $("fg-value").textContent = v == null ? "—" : v;
  $("fg-value").style.color = v == null ? "var(--tx-3)"
    : (v >= 55 ? "var(--gr)" : v <= 45 ? "var(--rd)" : "var(--yl)");
  $("fg-label").textContent = classification || (v == null ? t("fgNoData") : "");
}

function renderMayerGauge(value) {
  // Fixed 0–3 scale: 2.4 is the classic cycle-top threshold and 1.0 the
  // floor one, so both live comfortably inside the visible range.
  const v = value == null ? null : Number(value);
  const MAXV = 3;
  const pos = v == null ? null : Math.max(0, Math.min(180, v / MAXV * 180));
  const cx = 74, cy = 62, r = 52;
  const seg = (a, b, c, on) =>
    `<path d="${arcPath(cx, cy, r, a / MAXV * 180, b / MAXV * 180)}" stroke="${c}"
       stroke-width="9" fill="none" stroke-linecap="round" opacity="${on ? 1 : .22}"/>`;
  const zone = v == null ? -1 : (v < 1 ? 0 : v < 2.4 ? 1 : 2);
  const arcs = seg(0, 1, "#2EBD85", zone === 0) + seg(1, 2.4, "#E3B341", zone === 1) + seg(2.4, 3, "#F6465D", zone === 2);
  let needle = "";
  if (pos != null) {
    const rad = (pos - 180) * Math.PI / 180;
    const x = cx + (r - 15) * Math.cos(rad), y = cy + (r - 15) * Math.sin(rad);
    needle = `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}"
                stroke="#E8ECF2" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="${cx}" cy="${cy}" r="4" fill="#E8ECF2"/>`;
  }
  $("gauge-mayer").innerHTML = `<svg width="148" height="76" viewBox="0 0 148 76">${arcs}${needle}</svg>`;
  $("mayer-value").textContent = v == null ? "—" : fmtNum(v, 2);
  $("mayer-value").style.color = zone === 2 ? "var(--rd)" : zone === 0 ? "var(--gr)" : "var(--tx)";
  $("mayer-label").textContent = v == null ? t("mayerLabelDefault")
    : zone === 2 ? t("mayerZoneTop") : zone === 0 ? t("mayerZoneBottom") : t("mayerZoneMid");
}

// Two visuals that a bare number can't convey: how much of the 30-bullet
// budget this round has burned, and how far the combined position is from
// the +15% that closes it.
function renderRoundProgress(m) {
  const box = $("round-progress");
  if (!m.active.length) {
    box.innerHTML = `<p class="note mt">${t("roundProgressEmpty")}</p>`;
    return;
  }
  const used = m.active.length;
  const segs = Array.from({ length: MAX_BULLETS_PER_ROUND },
    (_, i) => `<i class="${i < used ? "on" : ""}"></i>`).join("");

  // The bar is drawn in PRICE space, over three anchors: liquidation on
  // the left, break-even in the middle, the +15% target on the right.
  //
  // The two halves use DIFFERENT scales on purpose. Under cross margin
  // the distance to liquidation is enormous (measured 2026-07-31: target
  // $66.4k vs BingX liquidation $414.70) because the whole free balance
  // backs the position -- exactly what the 30-bullet budget is for. A
  // single linear scale across that range would squeeze the +15% target
  // into ~3% of the bar and park a -12% reading at 95% of its width,
  // right beside the goal flag. Splitting at break-even keeps both
  // readings honest: "how far into the danger side" on the left, "how
  // close to closing the round" on the right.
  //
  // Without a liquidation price (flat, or the account_ticks migration not
  // applied yet) it falls back to the previous symmetric ±15% view.
  const hasLiq = m.liqPrice != null && m.breakEvenPrice != null
    && m.liqPrice > 0 && m.liqPrice < m.breakEvenPrice && m.price != null;

  let curPos, leftLabel, leftTitle;
  const zeroPos = 50;
  if (hasLiq) {
    curPos = m.price >= m.breakEvenPrice
      ? 50 + Math.min(50, (m.price - m.breakEvenPrice) / (m.targetPrice - m.breakEvenPrice) * 50)
      : 50 - Math.min(50, (m.breakEvenPrice - m.price) / (m.breakEvenPrice - m.liqPrice) * 50);
    leftLabel = fmtUsd0(m.liqPrice);
    leftTitle = t("liqTitleKnown");
  } else {
    const SPAN = 15;
    const g = Math.max(-SPAN, Math.min(SPAN, m.combinedGainPct));
    curPos = (g + SPAN) / (SPAN * 2) * 100;
    leftLabel = "-15%";
    leftTitle = t("liqTitleUnknown");
  }
  const fillLeft = Math.min(zeroPos, curPos), fillWidth = Math.abs(curPos - zeroPos);
  const color = m.combinedGainPct >= 0 ? "var(--gr)" : "var(--rd)";

  // How much of the drop to liquidation has actually been travelled --
  // the number the left half of the bar is showing.
  const toLiqPct = hasLiq ? (m.price - m.liqPrice) / m.price * 100 : null;

  box.innerHTML = `
    <div class="eyebrow mt" style="margin-bottom:2px">${t("bulletsUsedInRound", { r: m.currentRound })}</div>
    <div class="segs">${segs}</div>
    <div class="row" style="justify-content:space-between">
      <span class="note" style="margin:0">${t("bulletsUsedNote", { used, max: MAX_BULLETS_PER_ROUND })}</span>
    </div>
    <div class="eyebrow" style="margin-top:18px">${t("progressEyebrow")}</div>
    <div class="track">
      <div class="track-bg"></div>
      <div class="track-fill" style="left:${fillLeft}%;width:${fillWidth}%;background:${color}"></div>
      <div class="track-zero" style="left:${zeroPos}%" title="${t("breakEvenTitle", { price: fmtUsd0(m.breakEvenPrice) })}"></div>
      <div class="track-mark" style="left:${curPos}%" title="${t("currentPriceTitle", { price: fmtUsd0(m.price) })}"></div>
      <div class="track-end" style="left:0" title="${leftTitle}">${leftLabel}</div>
      <div class="track-goal" style="left:100%" title="${t("targetTitle", { price: fmtUsd0(m.targetPrice) })}">+15%</div>
    </div>
    <div class="row" style="justify-content:space-between">
      <span class="note mono ${clsSign(m.combinedGainPct)}" style="margin:0">${t("combinedLabel", { pct: fmtPct(m.combinedGainPct) })}</span>
      ${hasLiq ? `<span class="note" style="margin:0">${t("liquidatesAtLabel")} <b class="mono" style="color:var(--tx)">${fmtUsd0(m.liqPrice)}</b> <span class="dim">(−${fmtNum(toLiqPct, 1)}%)</span></span>` : ""}
      <span class="note" style="margin:0">${t("closesAtLabel")} <b class="mono" style="color:var(--tx)">${fmtUsd0(m.targetPrice)}</b></span>
    </div>`;
}

const DAY_MS = 86400000;

// Pick the snapshot closest to `targetMs`, or null if the nearest one is
// further away than the tolerance. Same approach as memory.py's
// _closest_snapshot, and for the same reason.
function _nearestSnapshot(candidates, targetMs, toleranceMs = 2 * DAY_MS) {
  let best = null, bestDiff = Infinity;
  for (const s of candidates) {
    if (!s.created_at) continue;
    const diff = Math.abs(new Date(s.created_at).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; best = s; }
  }
  return bestDiff <= toleranceMs ? best : null;
}

function renderCompare(snaps) {
  const block = $("compare-block");
  if (snaps.length < 2) { block.style.display = "none"; return; }

  const today = snaps[snaps.length - 1];
  // Chosen by DATE, not by index. snaps[length-2] is only "yesterday" if
  // there is exactly one snapshot per day -- while two schedulers were
  // both running the report (fixed 2026-07-31) this compared two runs of
  // the SAME morning and labelled the result "vs. ayer". A manual run
  // still reproduces that, so the lookup stays date-based.
  const todayMs = new Date(today.created_at).getTime();
  // Same-day snapshots are excluded BEFORE picking the nearest one.
  // Without this, a day holding only two runs and no earlier history
  // still resolves to "yesterday" a couple of hours ago -- the original
  // bug, just narrowed rather than fixed.
  const cutoff = todayMs - 12 * 3600 * 1000;
  const older = snaps.slice(0, -1).filter(
    s => s.created_at && new Date(s.created_at).getTime() <= cutoff);
  const ref = _nearestSnapshot(older, todayMs - DAY_MS);
  if (!ref) { block.style.display = "none"; return; }
  block.style.display = "block";

  const gapDays = Math.max(1, Math.round((todayMs - new Date(ref.created_at).getTime()) / DAY_MS));
  const gapLabel = gapDays === 1 ? t("vsYesterday") : t("vsDaysAgo", { n: gapDays });

  const yday = ref;
  const delta = (a, b) => (a == null || b == null) ? null : a - b;

  const rows = [
    { l: t("chartRecentPriceTitle"), d: delta(today.price, yday.price), f: fmtUsd0 },
    { l: "Fear & Greed", d: delta(today.fear_greed_value, yday.fear_greed_value), f: (n) => (n >= 0 ? "+" : "") + n },
    { l: "Mayer Multiple", d: delta(today.mayer_multiple, yday.mayer_multiple), f: (n) => (n >= 0 ? "+" : "") + fmtNum(n, 3) },
    { l: t("chartDominanceTitle"), d: delta(today.btc_dominance_pct, yday.btc_dominance_pct), f: (n) => fmtPct(n) },
  ];
  $("compare-stats").innerHTML = rows.map(r => statHtml({
    l: r.l, v: r.d == null ? "—" : r.f(r.d), vCls: clsSign(r.d), s: gapLabel,
  })).join("");
}

// ============ TABLES ============
function renderDcaTable(m) {
  const dca = cache.dca;
  if (!dca.length) {
    $("dca-table").innerHTML = `<div class="empty"><span class="big">◎</span>${t("dcaEmptyState")}</div>`;
    return;
  }
  // Newest first: the recent purchases are the ones you actually check.
  const rows = [...dca].reverse().map(p => {
    const btc = p.amount_usd / p.price;
    const val = m.price != null ? btc * m.price : null;
    const pnl = val != null ? val - Number(p.amount_usd) : null;
    const pnlPct = pnl != null ? pnl / Number(p.amount_usd) * 100 : null;
    return `<tr>
      <td>${fmtDate(p.purchased_at)}</td>
      <td class="num">${fmtUsd(p.amount_usd)}</td>
      <td class="num">${fmtUsd0(p.price)}</td>
      <td class="num dim">${fmtNum(btc, 8)}</td>
      <td class="num">${fmtUsd(val)}</td>
      <td class="num ${clsSign(pnl)}">${pnl == null ? "—" : fmtUsd(pnl)}</td>
      <td class="num ${clsSign(pnlPct)}">${fmtPct(pnlPct)}</td>
    </tr>`;
  }).join("");

  $("dca-table").innerHTML = `
    <table>
      <thead><tr>
        <th>${t("dcaTableDate")}</th><th class="num">${t("dcaTableAmount")}</th><th class="num">${t("dcaTableEffectivePrice")}</th>
        <th class="num">BTC</th><th class="num">${t("dcaTableValueToday")}</th><th class="num">P&L</th><th class="num">%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// The CSS class stays the RAW db status (bullets.status: open/tracking/
// closed_tp/closed_manual/closed_liquidated) so its colour never depends
// on the language -- only the label text shown inside the badge does.
const BULLET_STATUS_LABEL_KEY = {
  open: "statusOpen", tracking: "statusTracking", closed_tp: "statusClosedTp",
  closed_manual: "statusClosedManual", closed_liquidated: "statusClosedLiquidated",
};
const bulletStatusLabel = (status) => t(BULLET_STATUS_LABEL_KEY[status] || status);

function renderBulletsTable(m) {
  const bullets = cache.bullets;
  if (!bullets.length) {
    $("bullets-table").innerHTML = `<div class="empty"><span class="big">◎</span>${t("bulletsEmptyLine1")}<br />${t("bulletsEmptyLine2")}</div>`;
    return;
  }
  // Grouped by round, newest round first: a round is the unit that
  // actually opens and closes together, so the table should say so.
  const byRound = new Map();
  for (const b of bullets) {
    const r = b.round_number ?? 0;
    if (!byRound.has(r)) byRound.set(r, []);
    byRound.get(r).push(b);
  }
  const rounds = [...byRound.keys()].sort((a, b) => b - a);

  const body = rounds.map(r => {
    const rows = byRound.get(r);
    const isActive = rows.some(b => b.status === "open" || b.status === "tracking");
    const realized = rows.reduce((s, b) => s + (Number(b.realized_pnl_usd) || 0), 0);
    const outcome = (rows.find(b => (b.status || "").startsWith("closed")) || {}).status;

    const head = `<tr class="group"><td colspan="9">
      <span class="rn">${t("roundLabel", { r })}</span> · ${t("bulletsCount", { n: rows.length })} ·
      ${isActive
        ? `<span class="badge open">${t("badgeOngoing")}</span>`
        : `<span class="badge ${outcome || "closed_manual"}">${outcome === "closed_tp" ? t("badgeClosedTp") : t("badgeClosedOther")}</span>
           <span class="mono ${clsSign(realized)}"> ${fmtUsd(realized)}</span>`}
    </td></tr>`;

    const trs = rows.map(b => {
      const open = b.status === "open" || b.status === "tracking";
      // Open bullets have no realized P&L yet -- show the live unrealized
      // one instead of a dash, marked as such so it can't be confused with
      // a booked result.
      let pnlCell = `<td class="num dim">—</td>`;
      if (b.realized_pnl_usd != null) {
        pnlCell = `<td class="num ${clsSign(b.realized_pnl_usd)}">${fmtUsd(b.realized_pnl_usd)}</td>`;
      } else if (open && m.price != null) {
        const u = b.collateral_usd * ((m.price - b.entry_price) / b.entry_price * b.leverage);
        pnlCell = `<td class="num ${clsSign(u)}" title="${t("unrealizedTooltip")}">${fmtUsd(u)}<span class="src"> ${t("unrealizedAbbr")}</span></td>`;
      }
      return `<tr>
        <td class="mono dim">#${b.bullet_number}</td>
        <td><span class="badge ${b.status}">${bulletStatusLabel(b.status)}</span></td>
        <td class="num">${fmtUsd(b.collateral_usd)}</td>
        <td class="num">${fmtUsd0(b.entry_price)}</td>
        <td class="num dim">${fmtUsd0(b.target_price)}</td>
        <td class="num dim">${fmtUsd0(b.approx_liquidation_price)}</td>
        <td class="num">${b.closing_price ? fmtUsd0(b.closing_price) : "—"}</td>
        ${pnlCell}
        <td class="src">${b.bingx_order_id ? "BingX" : "manual"}</td>
      </tr>`;
    }).join("");
    return head + trs;
  }).join("");

  $("bullets-table").innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>${t("bulletsTableStatus")}</th><th class="num">${t("bulletsTableCollateral")}</th><th class="num">${t("bulletsTableEntry")}</th>
        <th class="num">${t("bulletsTableTarget")}</th><th class="num">${t("bulletsTableLiq")}</th><th class="num">${t("bulletsTableClose")}</th>
        <th class="num">P&L</th><th>${t("bulletsTableOrigin")}</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

// ============ CHARTS ============
Chart.defaults.font.family = "'JetBrains Mono', monospace";
Chart.defaults.font.size = 10;
Chart.defaults.color = "#5C6673";

function makeChart(canvasId, labels, data, color, opts = {}) {
  const el = $(canvasId);
  if (!el) return;
  if (charts[canvasId]) charts[canvasId].destroy();

  // Vertical fade under the line -- reads as depth without adding a
  // second visual language to the page.
  const ctx = el.getContext("2d");
  let fill = color + "1A";
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 240);
    g.addColorStop(0, color + "3D");
    g.addColorStop(1, color + "00");
    fill = g;
  } catch (e) {}

  charts[canvasId] = new Chart(el, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data, borderColor: color, backgroundColor: fill,
        borderWidth: opts.thin ? 1.4 : 2,
        pointRadius: 0, pointHoverRadius: 4,
        pointHoverBackgroundColor: color, pointHoverBorderColor: "#07090D", pointHoverBorderWidth: 2,
        tension: opts.thin ? 0.1 : 0.3, fill: true,
        spanGaps: true,
      }],
    },
    options: {
      // Aspect-ratio sizing on purpose: with maintainAspectRatio:false a
      // canvas needs a parent with an explicit height, and without one it
      // silently collapses to 0px -- which made the whole charts row
      // disappear. Letting Chart.js derive height from width avoids that.
      responsive: true, maintainAspectRatio: true, aspectRatio: opts.ratio || 2.1,
      animation: opts.thin ? false : { duration: 400 },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#161B23", borderColor: "rgba(255,255,255,.14)", borderWidth: 1,
          titleColor: "#97A1B0", bodyColor: "#E8ECF2", padding: 10,
          displayColors: false, cornerRadius: 8,
          callbacks: { label: (c) => (opts.fmt || ((v) => fmtUsd(v)))(c.parsed.y) },
        },
      },
      scales: {
        x: { ticks: { maxTicksLimit: 6, maxRotation: 0, autoSkipPadding: 18 },
             grid: { display: false }, border: { color: "rgba(255,255,255,.07)" } },
        y: { type: opts.yType || "linear",
             ticks: { maxTicksLimit: 5, callback: (v) => (opts.tick || ((x) => fmtUsd0(x)))(v) },
             grid: { color: "rgba(255,255,255,.05)" }, border: { display: false } },
      },
    },
  });
}

function renderRecentCharts() {
  // Very-recent price: prefer price_ticks (written every 15 min by
  // bullet-check) for real intraday resolution. Falls back to the
  // once-a-day snapshots if ticks haven't started accumulating yet.
  const series = cache.ticks.length ? cache.ticks : cache.snaps;
  $("chip-recent").textContent = cache.ticks.length ? t("every15min") : t("daily");
  // Named `tick`, not `t` -- this file also has a global t() for i18n
  // strings, and a same-named map parameter here would silently shadow it.
  makeChart("chart-price", series.map(tick => fmtDateTime(tick.created_at)),
    series.map(tick => tick.price), "#F7931A");

  const snaps = cache.snaps;
  const domLast = [...snaps].reverse().find(s => s.btc_dominance_pct != null);
  $("chip-dom").textContent = domLast ? fmtNum(domLast.btc_dominance_pct, 1) + "%" : "—";
  makeChart("chart-dominance", snaps.map(s => fmtDateShort(s.created_at)),
    snaps.map(s => s.btc_dominance_pct), "#4C8DFF",
    { fmt: (v) => fmtNum(v, 2) + "%", tick: (v) => fmtNum(v, 0) + "%" });
}

// ---- Market cycle: full-history data, independent of how long this
// agent has been running. Fetched once per dashboard load from two free,
// no-key public APIs.
const downsample = (arr, n) => arr.filter((_, i) => i % n === 0);

function rollingSma(values, windowSize) {
  const result = new Array(values.length).fill(null);
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= windowSize) sum -= values[i - windowSize];
    if (i >= windowSize - 1) result[i] = sum / windowSize;
  }
  return result;
}

// CoinGecko's free public API caps historical data at the last 365 days
// (confirmed empirically 2026-07-24 -- it used to allow days=max, no
// longer does without a paid plan) -- not enough to compute a 200-WEEK
// (1400-day) moving average. Binance's public klines endpoint has no such
// cap, needs no API key, and covers BTCUSDT back to 2017 -- paginated
// 1000 candles (Binance's max) per request.
async function fetchBinanceDailyCloses(symbol = "BTCUSDT") {
  const all = [];
  let startTime = new Date("2017-08-01T00:00:00Z").getTime();
  const limit = 1000;
  for (let i = 0; i < 8; i++) {   // safety cap, ~8000 days
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&startTime=${startTime}&limit=${limit}`;
    const res = await fetch(url);
    if (!res.ok) break;
    const rows = await res.json();
    if (!rows.length) break;
    for (const r of rows) all.push({ ts: r[0], price: Number(r[4]) });
    if (rows.length < limit) break;
    startTime = rows[rows.length - 1][0] + 24 * 60 * 60 * 1000;
  }
  return all;
}

async function loadMarketCycleData() {
  try {
    const [btcPrices, fngRes] = await Promise.all([
      fetchBinanceDailyCloses(),
      fetch("https://api.alternative.me/fng/?limit=0&format=json"),
    ]);
    if (!btcPrices.length) return;
    const fngJson = await fngRes.json();
    const fng = (fngJson.data || [])
      .map(d => ({ ts: Number(d.timestamp) * 1000, value: Number(d.value) }))
      .reverse();   // alternative.me returns newest-first

    const closes  = btcPrices.map(p => p.price);
    const sma200  = rollingSma(closes, 200);    // Mayer Multiple's denominator
    const sma1400 = rollingSma(closes, 1400);   // ~200 weeks of daily closes
    const mayer   = closes.map((p, i) => sma200[i] ? p / sma200[i] : null);
    const dist200w = closes.map((p, i) => sma1400[i] ? (p - sma1400[i]) / sma1400[i] * 100 : null);

    const lastDefined = (a) => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
    cache.cycle = {
      btcPrices, closes, mayer, dist200w, fng,
      mayerNow: lastDefined(mayer), dist200wNow: lastDefined(dist200w),
    };

    $("chip-mayer").textContent = fmtNum(cache.cycle.mayerNow, 2);
    $("chip-mayer").className = "chip " + (cache.cycle.mayerNow > 2.4 ? "hot" : cache.cycle.mayerNow < 1 ? "cold" : "");
    $("chip-200w").textContent = fmtPct(cache.cycle.dist200wNow);
    $("chip-200w").className = "chip " + clsSign(cache.cycle.dist200wNow).replace("pos", "up").replace("neg", "down");

    renderHero(deriveMetrics());   // hero Mayer gauge now has a fresher value
    if ($("panel-ciclo").classList.contains("active")) buildCycleCharts();
  } catch (e) {
    // Best-effort: these are independent public APIs with their own rate
    // limits -- if either is down, the rest of the dashboard still works.
    console.warn("Market cycle data fetch failed:", e);
  }
}

function buildCycleCharts() {
  const c = cache.cycle;
  if (!c) return;
  cycleChartsBuilt = true;

  // Thousands of daily points is more than the chart needs to look right
  // and slower to render -- plot roughly weekly.
  const step = 7;
  const labels = downsample(c.btcPrices, step).map(p => fmtDate(new Date(p.ts).toISOString()));

  makeChart("chart-price-history", labels, downsample(c.closes, step), "#F7931A",
    { thin: true, yType: "logarithmic", tick: (v) => "$" + (v >= 1000 ? (v / 1000) + "k" : v) });
  makeChart("chart-mayer-history", labels, downsample(c.mayer, step), "#4C8DFF",
    { thin: true, fmt: (v) => fmtNum(v, 2), tick: (v) => fmtNum(v, 1) });
  makeChart("chart-sma200w-history", labels, downsample(c.dist200w, step), "#A78BFA",
    { thin: true, fmt: (v) => fmtPct(v), tick: (v) => Math.round(v) + "%" });

  const fngStep = 3, fngDs = downsample(c.fng, fngStep);
  makeChart("chart-fg-history", fngDs.map(d => fmtDate(new Date(d.ts).toISOString())),
    fngDs.map(d => d.value), "#2EBD85",
    { thin: true, fmt: (v) => Math.round(v), tick: (v) => Math.round(v) });
}

// ============ REPORTS ============
function renderReports(snaps) {
  const withText = snaps.filter(s => s.report_text);
  if (!withText.length) {
    $("report-latest").innerHTML = `<div class="block"><div class="empty"><span class="big">✎</span>${t("reportEmptyState")}</div></div>`;
    $("archive-block").style.display = "none";
    return;
  }
  const latest = withText[withText.length - 1];
  $("report-latest").innerHTML = `
    <div class="report">
      <div class="mark sm">₿</div>
      <div class="report-body">
        <div class="report-meta">
          <b>${t("reportAgentLabel")}</b>
          <time>${fmtDateTime(latest.created_at)}</time>
        </div>
        <div class="report-text">${escapeHtml(latest.report_text)}</div>
      </div>
    </div>`;

  // Previous reports: the data was already loaded, and being able to look
  // back at what the agent said on a given day is the whole point of
  // keeping report_text per snapshot.
  const older = withText.slice(0, -1).reverse().slice(0, 20);
  if (!older.length) { $("archive-block").style.display = "none"; return; }
  $("archive-block").style.display = "block";
  $("report-archive").innerHTML = older.map((s, i) => `
    <button class="archive-item" data-i="${i}">
      <time>${fmtDateShort(s.created_at)}</time>
      <span class="snippet">${escapeHtml(s.report_text.replace(/\s+/g, " ").slice(0, 150))}</span>
    </button>`).join("");

  $("report-archive").querySelectorAll(".archive-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const s = older[Number(btn.dataset.i)];
      $("report-latest").innerHTML = `
        <div class="report">
          <div class="mark sm">₿</div>
          <div class="report-body">
            <div class="report-meta">
              <b>${t("reportAgentLabel")}</b>
              <time>${fmtDateTime(s.created_at)}</time>
              <span class="chip">${t("reportArchivedChip")}</span>
            </div>
            <div class="report-text">${escapeHtml(s.report_text)}</div>
          </div>
        </div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

// report_text comes from an LLM, so it is never injected as raw HTML.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

init();
